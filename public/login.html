<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Login</title>
    <link rel="icon" href="Images/logo.png" type="image/x-icon" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1CmrxMRARb6aLqgBO7+cdXk4mfWbBPOuC0gKfyP57sczzxMG17j6kNj7A1WTI3Sm" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="w-full max-w-xs">
    <div class="flex justify-center mb-4">
        <a href="https://www.codxo.in/"><img src="Images/logo1.png" alt="CodXo Logo" class="h-20 w-20"></a>
    </div>
    <h3 class="text-xl font-bold mb-6 text-center">Fill the joining form for Credentials</h3>
    <form id="loginForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        <h2 class="text-2xl font-bold mb-6 text-center">Intern Login</h2>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="internId">
                Intern ID
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="internId" type="text" placeholder="Enter your Intern ID">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                Password (WhatsApp Number)
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="Enter your WhatsApp Number">
        </div>
        <div class="flex items-center justify-between">
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" onclick="login()">
                Sign In
            </button>
        </div>
    </form>
    <div id="spinner" class="d-none justify-content-center align-items-center position-fixed w-100 h-100">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
</div>

<script>
    async function login() {
        // Show the spinner
        document.getElementById('spinner').classList.remove('d-none');
        const internId = document.getElementById('internId').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/intern/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ internId, whatsappNumber:password })
            });

            // Hide the spinner
            document.getElementById('spinner').classList.add('d-none');

            if (response.ok) {
                const result = await response.json();
                localStorage.setItem('internId', result.internId); // Store internId in localStorage
                alert('Login successful!');
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid Intern ID or Password. Please try again.');
            }
        } catch (error) {
            console.error('Error during login:', error);
            alert('An error occurred. Please try again later.');
        }
    }
</script>

<!-- Bootstrap JS and Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js" integrity="sha384-7/zSfpLE2qNQihc7iTQKY/p6kN01zbiWkQFtNHEqx8L5eo1lGi5J5Et7HA6fhc30" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12G8gjVJm1pxC0b5o2Fw5f2yDxGf6bH6A+j3pI4Hzf6zkFo" crossorigin="anonymous"></script>

</body>
</html>
