<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .hero-btn {
            display: inline-block;
            padding: 10px 30px;
            font-size: 18px;
            color: #fff;
            background-color: #f76c6c;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .hero-btn:hover {
            background-color: #e65c5c;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            position: relative;
            text-align: center;
            max-height: 90%;
            overflow-y: auto;
        }
        .modal-content h2 {
            margin: 0 0 20px;
            font-size: 24px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 10px;
            text-align: left;
        }
        .modal-content input[type="text"],
        .modal-content input[type="email"],
        .modal-content select,
        .modal-content .radio-group {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .modal-content .radio-group {
            display: flex;
            justify-content: space-around;
        }
        .modal-content .radio-group label {
            display: flex;
            align-items: center;
            margin: 0;
        }
        .modal-content input[type="submit"],
        .modal-content .cancel-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .modal-content input[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }
        .modal-content .cancel-btn {
            background-color: #f44336;
            color: white;
            margin-left: 10px;
        }
        .modal-content input[type="submit"]:hover {
            background-color: #45a049;
        }
        .modal-content .cancel-btn:hover {
            background-color: #e31b0c;
        }
        .modal-content .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
        }
        .success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <a href="#" class="hero-btn" onclick="showModal()">Register Now</a>

    <div class="modal" id="formModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Register</h2>
            <form id="myForm">
                <label for="entry1">Name:</label>
                <input type="text" id="entry1" name="entry.2005620555" required>
                
                <label for="entry2">Email:</label>
                <input type="email" id="entry2" name="entry.1045781291" required>
                
                <label for="entry3">Gender:</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.1065046570" value="Male" required> Male</label>
                    <label><input type="radio" name="entry.1065046570" value="Female"> Female</label>
                </div>
                
                <label for="entry4">Chosen domain for internships:</label>
                <select id="entry4" name="entry.1166974658" required>
                    <option value="Web Development">Web Development</option>
                    <option value="Android App Development">Android App Development</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Java Programming">Java Programming</option>
                    <option value="Python Programming">Python Programming</option>
                    <option value="C Programming">C Programming</option>
                    <option value="C++ Programming">C++ Programming</option>
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                </select>
                
                <label for="entry5">Mode of internship:</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.839337160" value="Remote" required> Remote</label>
                </div>
                
                <label for="entry6">College:</label>
                <input type="text" id="entry6" name="entry.2117834446" required>
                
                <label for="entry7">City:</label>
                <input type="text" id="entry7" name="entry.1296817522" required>
                
                <label for="entry8">Country:</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.2129446416" value="India" required> India</label>
                    <label><input type="radio" name="entry.2129446416" value="Other"> Other: <input type="text" name="entry.2129446416.other_option_response"></label>
                </div>
                
                <label for="entry9">Highest Academic Qualification:</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.2066323067" value="Intermediate (10+2)" required> Intermediate (10+2)</label>
                    <label><input type="radio" name="entry.2066323067" value="Graduation"> Graduation</label>
                    <label><input type="radio" name="entry.2066323067" value="Post Graduation"> Post Graduation</label>
                </div>
                
                <label for="entry10">Course Name:</label>
                <input type="text" id="entry10" name="entry.122174465" required>
                
                <label for="entry11">Department Name:</label>
                <input type="text" id="entry11" name="entry.101530227" required>
                
                <label for="entry12">Year:</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.2021168864" value="1st Year" required> 1st Year</label>
                    <label><input type="radio" name="entry.2021168864" value="2nd Year"> 2nd Year</label>
                    <label><input type="radio" name="entry.2021168864" value="3rd Year"> 3rd Year</label>
                    <label><input type="radio" name="entry.2021168864" value="4th Year"> 4th Year</label>
                </div>
                
                <label for="entry13">Contact No.:</label>
                <input type="text" id="entry13" name="entry.384570481" required>
                
                <label for="entry14">WhatsApp Number:</label>
                <input type="text" id="entry14" name="entry.254297697" required>
                
                <label for="entry15">Where did you discover about Codxo?</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.134671029" value="Social Media (Instagram, LinkedIn, etc.)" required> Social Media (Instagram, LinkedIn, etc.)</label>
                    <label><input type="radio" name="entry.134671029" value="Referral (Friends, Colleagues, Relatives etc.)"> Referral (Friends, Colleagues, Relatives etc.)</label>
                    <label><input type="radio" name="entry.134671029" value="Campus Placement Cell/Coordinators"> Campus Placement Cell/Coordinators</label>
                </div>
                
                <label for="entry16">Followed Our Social Media Page?</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.1923047395" value="Yes" required> Yes</label>
                    <label><input type="radio" name="entry.1923047395" value="No"> No</label>
                </div>
                
                <label for="entry17">I understand the details of the internship, and I hereby agree to the terms and conditions set down by CIP.</label>
                <div class="radio-group">
                    <label><input type="radio" name="entry.741258963" value="Yes" required> Yes</label>
                </div>

                <input type="submit" value="Submit">
                <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        Form submitted successfully!
    </div>

    <script>
        function showModal() {
            document.getElementById('formModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        document.getElementById('myForm').addEventListener('submit', function(event) {
            event.preventDefault();
            var formData = new FormData(this);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://docs.google.com/forms/d/e/1FAIpQLScV3V7HCpvvEMsxxLXQLBrCoWuIKXPOx3m4dzJ8A3aj74c1Aw/formResponse', true);
            xhr.setRequestHeader('Accept-Encoding', 'gzip, deflate, br');
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.send(new URLSearchParams(formData).toString());
            xhr.onload = function() {
                if (xhr.status === 200 || xhr.status === 0) {
                    document.getElementById('formModal').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                    setTimeout(function() {
                        document.getElementById('successMessage').style.display = 'none';
                    }, 5000);
                } else {
                    alert('Form submission failed.');
                }
            };
        });
    </script>
</body>
</html>
